<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0, so the sticky masthead can clear the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Let Safari draw native scrollbars/controls in the right scheme. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Status-bar tint follows the theme; values match --bg in app.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Have Your Say" />
    <!-- Speech bubble with a live dot, tinted per scheme so the icon never
         vanishes into the tab strip. Inline data URIs: no asset round-trip. -->
    <link
      rel="icon"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231a3fb8' d='M9 3h14a7 7 0 0 1 7 7v6a7 7 0 0 1-7 7h-7l-7 6v-6a7 7 0 0 1-7-7v-6a7 7 0 0 1 7-7z'/%3E%3Ccircle cx='10.5' cy='13' r='2.2' fill='%23fff'/%3E%3Ccircle cx='16' cy='13' r='2.2' fill='%23fff'/%3E%3Ccircle cx='21.5' cy='13' r='2.2' fill='%234ade80'/%3E%3C/svg%3E"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%237d9cff' d='M9 3h14a7 7 0 0 1 7 7v6a7 7 0 0 1-7 7h-7l-7 6v-6a7 7 0 0 1-7-7v-6a7 7 0 0 1 7-7z'/%3E%3Ccircle cx='10.5' cy='13' r='2.2' fill='%230e1116'/%3E%3Ccircle cx='16' cy='13' r='2.2' fill='%230e1116'/%3E%3Ccircle cx='21.5' cy='13' r='2.2' fill='%2315803d'/%3E%3C/svg%3E"
    />
    <title>Have Your Say — live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>
